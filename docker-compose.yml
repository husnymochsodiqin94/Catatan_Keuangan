# Deploy: app (stdlib Python) di belakang Caddy (HTTPS otomatis).
# Isi .env dari .env.example lalu: docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      CATATAN_TOKEN: ${CATATAN_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-}
    volumes:
      - catatan-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  catatan-data:
  caddy-data:
  caddy-config:
